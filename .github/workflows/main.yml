name: Build Nila AI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Nila AI
        run: |
          mkdir -p app/src/main/java/com/nila/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NilaAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nila.ai'
              compileSdk 35

              defaultConfig {
                  applicationId "com.nila.ai"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Nila AI">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Nila AI"
                  android:textSize="28sp"
                  android:textStyle="bold"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <Button
                      android:id="@+id/chatTab"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="CHAT"/>

                  <Button
                      android:id="@+id/photoTab"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="PHOTO EDIT"/>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/chatPanel"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical">

                  <ScrollView
                      android:id="@+id/scroll"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1">

                      <LinearLayout
                          android:id="@+id/messages"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"/>
                  </ScrollView>

                  <EditText
                      android:id="@+id/input"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="தமிழ் அல்லது English-ல் கேளுங்கள்"
                      android:maxLines="3"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <Button
                          android:id="@+id/send"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="SEND"/>

                      <Button
                          android:id="@+id/clear"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="CLEAR"/>
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/photoPanel"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <Button
                      android:id="@+id/choose"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="CHOOSE PHOTO"/>

                  <ImageView
                      android:id="@+id/image"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:scaleType="fitCenter"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <Button
                          android:id="@+id/rotate"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="ROTATE"/>

                      <Button
                          android:id="@+id/gray"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="B&amp;W"/>

                      <Button
                          android:id="@+id/reset"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="RESET"/>
                  </LinearLayout>
              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/nila/ai/MainActivity.java <<'EOF'
          package com.nila.ai;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              LinearLayout messages, chatPanel, photoPanel;
              EditText input;
              ScrollView scroll;
              ImageView image;
              Bitmap original, edited;
              static final int PICK = 100;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);

                  messages = findViewById(R.id.messages);
                  chatPanel = findViewById(R.id.chatPanel);
                  photoPanel = findViewById(R.id.photoPanel);
                  input = findViewById(R.id.input);
                  scroll = findViewById(R.id.scroll);
                  image = findViewById(R.id.image);

                  findViewById(R.id.chatTab).setOnClickListener(v -> {
                      chatPanel.setVisibility(View.VISIBLE);
                      photoPanel.setVisibility(View.GONE);
                  });

                  findViewById(R.id.photoTab).setOnClickListener(v -> {
                      chatPanel.setVisibility(View.GONE);
                      photoPanel.setVisibility(View.VISIBLE);
                  });

                  findViewById(R.id.send).setOnClickListener(v -> send());
                  findViewById(R.id.clear).setOnClickListener(v -> {
                      messages.removeAllViews();
                      add("Nila AI", "புதிய chat ஆரம்பிக்கலாம்.");
                  });

                  findViewById(R.id.choose).setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("image/*");
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(i, PICK);
                  });

                  findViewById(R.id.rotate).setOnClickListener(v -> rotate());
                  findViewById(R.id.gray).setOnClickListener(v -> gray());
                  findViewById(R.id.reset).setOnClickListener(v -> reset());

                  add("Nila AI",
                      "வணக்கம்! நான் Nila AI. Chat மற்றும் Photo Edit பயன்படுத்தலாம்.");
              }

              void send() {
                  String q = input.getText().toString().trim();
                  if (q.isEmpty()) return;

                  add("You", q);
                  input.setText("");

                  String s = q.toLowerCase(Locale.ROOT);
                  String a;

                  if (s.contains("hello") || s.contains("hi") ||
                      s.contains("வணக்கம்"))
                      a = "வணக்கம்! எப்படி உதவலாம்?";
                  else if (s.contains("name") || s.contains("பெயர்"))
                      a = "என் பெயர் Nila AI.";
                  else if (s.contains("photo") || s.contains("image") ||
                           s.contains("படம்"))
                      a = "PHOTO EDIT tab-ல் photo தேர்வு செய்யுங்கள்.";
                  else
                      a = "இது offline starter version. Full AI knowledge later சேர்க்கலாம்.";

                  add("Nila AI", a);
              }

              void add(String name, String text) {
                  TextView t = new TextView(this);
                  t.setText(name + "\n" + text);
                  t.setTextSize(17);
                  t.setPadding(10,16,10,16);
                  messages.addView(t);
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
              }

              @Override
              protected void onActivityResult(int r, int c, Intent data) {
                  super.onActivityResult(r,c,data);

                  if (r == PICK && c == RESULT_OK &&
                      data != null && data.getData() != null) {
                      try {
                          Uri uri = data.getData();
                          InputStream in =
                              getContentResolver().openInputStream(uri);
                          original = BitmapFactory.decodeStream(in);
                          if (in != null) in.close();

                          if (original != null) {
                              edited = original.copy(
                                  Bitmap.Config.ARGB_8888, true);
                              image.clearColorFilter();
                              image.setImageBitmap(edited);
                          }
                      } catch(Exception e) {
                          Toast.makeText(this,
                              "Photo open error",
                              Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              void rotate() {
                  if (edited == null) return;

                  Matrix m = new Matrix();
                  m.postRotate(90);

                  edited = Bitmap.createBitmap(
                      edited, 0, 0,
                      edited.getWidth(),
                      edited.getHeight(),
                      m, true);

                  image.clearColorFilter();
                  image.setImageBitmap(edited);
              }

              void gray() {
                  if (edited == null) return;

                  ColorMatrix m = new ColorMatrix();
                  m.setSaturation(0);

                  image.setColorFilter(
                      new ColorMatrixColorFilter(m));
              }

              void reset() {
                  if (original == null) return;

                  edited = original.copy(
                      Bitmap.Config.ARGB_8888, true);

                  image.clearColorFilter();
                  image.setImageBitmap(edited);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nila-AI-v1.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
