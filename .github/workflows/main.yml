name: Build Nila AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nila/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NilaAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nila.ai'
              compileSdk 35

              defaultConfig {
                  applicationId "com.nila.ai"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Nila AI"
                  android:theme="@style/Theme.NilaAI">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.NilaAI" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Nila AI</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Nila AI"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:paddingBottom="6dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="உங்கள் personal assistant"
                  android:textSize="14sp"
                  android:paddingBottom="12dp" />

              <ScrollView
                  android:id="@+id/scroll"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <LinearLayout
                      android:id="@+id/chatContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical" />

              </ScrollView>

              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="தமிழ் அல்லது English-ல் type செய்யுங்கள்"
                  android:minHeight="48dp"
                  android:padding="12dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/sendBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Send" />

                  <Button
                      android:id="@+id/clearBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Clear" />

              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/nila/ai/MainActivity.java <<'EOF'
          package com.nila.ai;

          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.ViewGroup;
          import android.widget.*;

          import androidx.appcompat.app.AppCompatActivity;

          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              LinearLayout chatContainer;
              EditText input;
              ScrollView scroll;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  chatContainer = findViewById(R.id.chatContainer);
                  input = findViewById(R.id.input);
                  scroll = findViewById(R.id.scroll);

                  Button sendBtn = findViewById(R.id.sendBtn);
                  Button clearBtn = findViewById(R.id.clearBtn);

                  addMessage(
                          "Nila AI",
                          "வணக்கம்! நான் Nila AI. தமிழ் அல்லது English-ல் கேளுங்கள்.",
                          false
                  );

                  sendBtn.setOnClickListener(v -> {
                      String q = input.getText().toString().trim();

                      if (q.isEmpty()) {
                          return;
                      }

                      addMessage("You", q, true);

                      input.setText("");

                      addMessage(
                              "Nila AI",
                              offlineReply(q),
                              false
                      );
                  });

                  clearBtn.setOnClickListener(v -> {
                      chatContainer.removeAllViews();

                      addMessage(
                              "Nila AI",
                              "Chat cleared. புதிதாக ஆரம்பிக்கலாம்.",
                              false
                      );
                  });
              }

              private void addMessage(String who, String msg, boolean me) {

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(16, 12, 16, 12);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  params.setMargins(
                          me ? 80 : 0,
                          8,
                          me ? 0 : 80,
                          8
                  );

                  box.setLayoutParams(params);

                  TextView name = new TextView(this);
                  name.setText(who);
                  name.setTypeface(null, Typeface.BOLD);

                  TextView text = new TextView(this);
                  text.setText(msg);
                  text.setTextSize(16);

                  box.addView(name);
                  box.addView(text);

                  chatContainer.addView(box);

                  scroll.post(
                          () -> scroll.fullScroll(ScrollView.FOCUS_DOWN)
                  );
              }

              private String offlineReply(String q) {

                  String s = q.toLowerCase(Locale.ROOT);

                  if (s.contains("hello")
                          || s.contains("hi")
                          || s.contains("வணக்கம்")) {

                      return "வணக்கம்! எப்படி உதவலாம்?";
                  }

                  if (s.contains("name")
                          || s.contains("பெயர்")) {

                      return "என் பெயர் Nila AI.";
                  }

                  if (s.contains("car")
                          || s.contains("engine")
                          || s.contains("கார்")
                          || s.contains("எஞ்சின்")) {

                      return "Automotive question detected. இந்த version offline starter.";
                  }

                  if (s.contains("gravity")
                          || s.contains("கிராவிட்டி")
                          || s.contains("ஈர்ப்பு")) {

                      return "Gravity பற்றி கேள்வி கேட்டுள்ளீர்கள். இந்த offline version basic reply மட்டும் தரும்.";
                  }

                  return "இந்த version offline starter. Full AI features later add செய்யலாம்.";
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nila-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
