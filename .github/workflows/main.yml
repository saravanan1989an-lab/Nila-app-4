name: Build Nila AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nila/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NilaAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nila.ai'
              compileSdk 35

              defaultConfig {
                  applicationId "com.nila.ai"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "1.2"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Nila AI"
                  android:theme="@style/Theme.NilaAI">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.NilaAI" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Nila AI</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Nila AI"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="உங்கள் personal assistant"
                  android:textSize="15sp"
                  android:paddingBottom="10dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/chatModeBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Chat" />

                  <Button
                      android:id="@+id/photoModeBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Photo Edit" />

              </LinearLayout>

              <LinearLayout
                  android:id="@+id/chatPanel"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical">

                  <ScrollView
                      android:id="@+id/scroll"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:fillViewport="true">

                      <LinearLayout
                          android:id="@+id/chatContainer"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical" />

                  </ScrollView>

                  <EditText
                      android:id="@+id/input"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="தமிழ் அல்லது English-ல் type செய்யுங்கள்"
                      android:minHeight="48dp"
                      android:maxLines="4"
                      android:padding="12dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/sendBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Send" />

                      <Button
                          android:id="@+id/clearBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Clear" />

                  </LinearLayout>

              </LinearLayout>

              <ScrollView
                  android:id="@+id/photoPanel"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingTop="10dp">

                      <Button
                          android:id="@+id/choosePhotoBtn"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Choose Photo" />

                      <ImageView
                          android:id="@+id/photoPreview"
                          android:layout_width="match_parent"
                          android:layout_height="360dp"
                          android:adjustViewBounds="true"
                          android:scaleType="fitCenter"
                          android:contentDescription="Photo preview" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/rotateBtn"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Rotate" />

                          <Button
                              android:id="@+id/grayBtn"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Grayscale" />

                      </LinearLayout>

                      <Button
                          android:id="@+id/resetBtn"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Reset Photo" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:paddingTop="12dp"
                          android:text="AI photo editing later சேர்க்கலாம். இப்போது basic offline editing."
                          android:textSize="14sp" />

                  </LinearLayout>

              </ScrollView>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/nila/ai/MainActivity.java <<'EOF'
          package com.nila.ai;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;

          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              LinearLayout chatContainer;
              LinearLayout chatPanel;
              ScrollView scroll;
              ScrollView photoPanel;

              EditText input;
              ImageView photoPreview;

              Bitmap originalBitmap;
              Bitmap editedBitmap;

              ActivityResultLauncher<String> photoPicker;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  LinearLayout root = findViewById(R.id.rootLayout);

                  int left = root.getPaddingLeft();
                  int top = root.getPaddingTop();
                  int right = root.getPaddingRight();
                  int bottom = root.getPaddingBottom();

                  ViewCompat.setOnApplyWindowInsetsListener(
                          root,
                          (v, insets) -> {

                              Insets systemBars =
                                      insets.getInsets(
                                              WindowInsetsCompat.Type.systemBars()
                                      );

                              v.setPadding(
                                      left + systemBars.left,
                                      top + systemBars.top,
                                      right + systemBars.right,
                                      bottom + systemBars.bottom
                              );

                              return insets;
                          }
                  );

                  chatContainer = findViewById(R.id.chatContainer);
                  chatPanel = findViewById(R.id.chatPanel);
                  photoPanel = findViewById(R.id.photoPanel);

                  input = findViewById(R.id.input);
                  scroll = findViewById(R.id.scroll);

                  photoPreview = findViewById(R.id.photoPreview);

                  Button sendBtn = findViewById(R.id.sendBtn);
                  Button clearBtn = findViewById(R.id.clearBtn);

                  Button chatModeBtn = findViewById(R.id.chatModeBtn);
                  Button photoModeBtn = findViewById(R.id.photoModeBtn);

                  Button choosePhotoBtn =
                          findViewById(R.id.choosePhotoBtn);

                  Button rotateBtn =
                          findViewById(R.id.rotateBtn);

                  Button grayBtn =
                          findViewById(R.id.grayBtn);

                  Button resetBtn =
                          findViewById(R.id.resetBtn);

                  photoPicker =
                          registerForActivityResult(
                                  new ActivityResultContracts.GetContent(),
                                  uri -> {

                                      if (uri != null) {
                                          loadPhoto(uri);
                                      }
                                  }
                          );

                  addMessage(
                          "Nila AI",
                          "வணக்கம்! நான் Nila AI. தமிழ் அல்லது English-ல் கேளுங்கள்.",
                          false
                  );

                  chatModeBtn.setOnClickListener(v -> {

                      chatPanel.setVisibility(View.VISIBLE);
                      photoPanel.setVisibility(View.GONE);

                  });

                  photoModeBtn.setOnClickListener(v -> {

                      chatPanel.setVisibility(View.GONE);
                      photoPanel.setVisibility(View.VISIBLE);

                  });

                  sendBtn.setOnClickListener(v -> {

                      String q =
                              input.getText()
                                      .toString()
                                      .trim();

                      if (q.isEmpty()) {
                          return;
                      }

                      addMessage(
                              "You",
                              q,
                              true
                      );

                      input.setText("");

                      addMessage(
                              "Nila AI",
                              offlineReply(q),
                              false
                      );
                  });

                  clearBtn.setOnClickListener(v -> {

                      chatContainer.removeAllViews();

                      addMessage(
                              "Nila AI",
                              "Chat cleared. புதிதாக ஆரம்பிக்கலாம்.",
                              false
                      );
                  });

                  choosePhotoBtn.setOnClickListener(v -> {

                      photoPicker.launch("image/*");

                  });

                  rotateBtn.setOnClickListener(v -> {

                      if (editedBitmap == null) {
                          showMessage("முதலில் photo தேர்வு செய்யுங்கள்.");
                          return;
                      }

                      Matrix matrix = new Matrix();
                      matrix.postRotate(90);

                      editedBitmap =
                              Bitmap.createBitmap(
                                      editedBitmap,
                                      0,
                                      0,
                                      editedBitmap.getWidth(),
                                      editedBitmap.getHeight(),
                                      matrix,
                                      true
                              );

                      photoPreview.setImageBitmap(
                              editedBitmap
                      );
                  });

                  grayBtn.setOnClickListener(v -> {

                      if (editedBitmap == null) {
                          showMessage("முதலில் photo தேர்வு செய்யுங்கள்.");
                          return;
                      }

                      ColorMatrix matrix =
                              new ColorMatrix();

                      matrix.setSaturation(0);

                      photoPreview.setColorFilter(
                              new ColorMatrixColorFilter(
                                      matrix
                              )
                      );
                  });

                  resetBtn.setOnClickListener(v -> {

                      if (originalBitmap == null) {
                          return;
                      }

                      editedBitmap =
                              originalBitmap.copy(
                                      originalBitmap.getConfig(),
                                      true
                              );

                      photoPreview.clearColorFilter();

                      photoPreview.setImageBitmap(
                              editedBitmap
                      );
                  });
              }

              private void loadPhoto(Uri uri) {

                  try {

                      InputStream stream =
                              getContentResolver()
                                      .openInputStream(uri);

                      originalBitmap =
                              BitmapFactory.decodeStream(
                                      stream
                              );

                      if (stream != null) {
                          stream.close();
                      }

                      if (originalBitmap != null) {

                          editedBitmap =
                                  originalBitmap.copy(
                                          originalBitmap.getConfig(),
                                          true
                                  );

                          photoPreview.clearColorFilter();

                          photoPreview.setImageBitmap(
                                  editedBitmap
                          );
            
